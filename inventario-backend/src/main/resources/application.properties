# Conexao com o Postgres.
# Pode preencher os valores diretamente aqui (mais simples para rodar local),
# ou definir as variaveis de ambiente PGHOST, PGPORT, PGDATABASE, PGUSER,
# PGPASSWORD, PGSCHEMA antes de iniciar a aplicacao - nesse caso elas tem
# prioridade sobre os valores padrao (depois dos dois-pontos) abaixo.

spring.datasource.url=jdbc:postgresql://${PGHOST:****}:${PGPORT:****}/${PGDATABASE:***}
spring.datasource.username=${PGUSER:***}
spring.datasource.password=${PGPASSWORD:*****}
spring.datasource.driver-class-name=org.postgresql.Driver

# Executa esse SQL em toda nova conexao aberta no pool, equivalente ao
# "SET search_path" usado na versao Python.
spring.datasource.hikari.connection-init-sql=SET search_path TO ${PGSCHEMA:lgpd_sentinel}, public

# Porta em que a API vai rodar (o front-end React aponta para essa porta).
server.port=8080

# Tamanho maximo de arquivo aceito na importacao em lote (CSV/XLSX).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mensagens de erro mais detalhadas no console durante o desenvolvimento.
logging.level.com.inventario=INFO
